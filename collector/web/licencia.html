<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licencia · Mesa de Acción</title>
<script>try { const t = localStorage.getItem("mesa.tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch { /* sin almacenamiento: tema del sistema */ }</script>
<!--MARCA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<style>
/* Página de licencia: se muestra en lugar del tablero cuando la licencia de la app instalada venció o falta. */
:root{--ground:#F3F3EF;--surface:#FFFFFF;--ink:#15140F;--ink-2:#4A4840;--ink-3:#7C796E;--line:#DCDBD3;--brand:#FFD100;--brand-ink:#15140F;
  --ok:#2F7D4F;--ok-bg:#E3F1E7;--bad:#B42323;--bad-bg:#F8E0DE;--f-display:"Archivo","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#121210;--surface:#1B1A17;--ink:#F1F0EA;--ink-2:#C4C2B8;--ink-3:#8F8C81;--line:#35342E;--ok:#7CCB98;--ok-bg:#1F3326;--bad:#F08A84;--bad-bg:#3A1C1A}}
:root[data-theme="dark"]{--ground:#121210;--surface:#1B1A17;--ink:#F1F0EA;--ink-2:#C4C2B8;--ink-3:#8F8C81;--line:#35342E;--ok:#7CCB98;--ok-bg:#1F3326;--bad:#F08A84;--bad-bg:#3A1C1A}
:root[data-marca="irtp"]{--brand:#C1002D;--brand-ink:#FFFFFF}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--f-display)}
.mast{background:var(--brand);color:var(--brand-ink);padding:18px 16px}
.mast-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:14px}
.marca-logo{display:block;height:48px;width:auto}
.mast h1{margin:0;font-size:26px;line-height:1;font-weight:800;font-variation-settings:"wdth" 70;text-transform:uppercase}
main{max-width:620px;margin:0 auto;padding:22px 16px 48px}
.box{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--bad);padding:18px 20px}
.box.vigente{border-top-color:var(--ok)}
.box h2{margin:0 0 8px;font-size:22px}
.box p{margin:0 0 10px;color:var(--ink-2)}
.datos{color:var(--ink);font-weight:600}
label{display:block;font-weight:700;margin:18px 0 6px}
textarea{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace}
button{margin-top:10px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:4px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
.msg{margin-top:12px;padding:9px 12px;border-radius:4px;font-size:14px}
.msg.mal{background:var(--bad-bg);color:var(--bad)}
.msg.bien{background:var(--ok-bg);color:var(--ok)}
.nota{font-size:13px;color:var(--ink-3);margin-top:16px}
</style>

<header class="mast"><div class="mast-in"><!--MARCA-LOGO--><h1>Mesa de Acción</h1></div></header>
<main>
  <div class="box">
    <h2 id="titulo">Licencia</h2>
    <p id="motivo"></p>
    <p class="datos" id="datos" hidden></p>
    <p id="contacto" hidden></p>
    <p id="efecto">Mientras tanto la Mesa no consulta las fuentes ni redacta con IA. Los datos ya guardados en esta computadora se conservan.</p>
    <label for="codigo">Código de licencia</label>
    <textarea id="codigo" placeholder="MESA-…" spellcheck="false"></textarea>
    <button type="button" id="activar">Activar</button>
    <div class="msg" id="msg" hidden role="status"></div>
  </div>
  <p class="nota">El código es una sola línea que empieza con MESA-. Se puede pegar con espacios o saltos de línea: se limpian solos.</p>
</main>
<script>
const $ = s => document.querySelector(s);
const fecha = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-PE", {day: "numeric", month: "long", year: "numeric"}) : "";
async function cargar() {
  const e = await (await fetch("/api/licencia", {cache: "no-store"})).json();
  if (!e.requerida) { location.href = "/"; return; }
  if (e.valida) {   // se llega desde el aviso de vencimiento: muestra la vigente y permite cargar la renovación
    $(".box").classList.add("vigente"); $("#efecto").hidden = true;
    $("#titulo").textContent = "Licencia vigente";
    $("#motivo").textContent = `Vence el ${fecha(e.vence)}. Si recibió un código de renovación, péguelo aquí. Volver al tablero: `;
    $("#motivo").insertAdjacentHTML("beforeend", '<a href="/">abrir</a>.');
  } else {
    $("#titulo").textContent = e.vence ? "La licencia venció" : "Falta la licencia";
    $("#motivo").textContent = e.motivo || "";
  }
  if (e.cliente) { $("#datos").hidden = false; $("#datos").textContent = `Licencia de ${e.cliente}${e.vence ? ` · ${e.valida ? "vence" : "venció"} el ${fecha(e.vence)}` : ""}`; }
  if (e.contacto) { $("#contacto").hidden = false; $("#contacto").textContent = `Para renovarla: ${e.contacto}`; }
}
$("#activar").onclick = async () => {
  const r = await fetch("/api/licencia", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({codigo: $("#codigo").value})});
  const b = await r.json().catch(() => ({}));
  $("#msg").hidden = false;
  if (r.ok && b.valida) { $("#msg").className = "msg bien"; $("#msg").textContent = `Licencia activada hasta el ${fecha(b.vence)}. Abriendo el tablero…`; setTimeout(() => location.href = "/", 1500); }
  else { $("#msg").className = "msg mal"; $("#msg").textContent = b.detail || "No se pudo activar el código."; }
};
cargar();
</script>
